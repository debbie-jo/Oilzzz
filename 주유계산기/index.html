<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>수도전 주유 시간 계산기</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Whiteout Survival</p>
          <h1>수도전 주유</h1>
        </div>
        <div class="clock">
          <span id="nowTime">--:--:--</span>
          <small>UTC 기준</small>
          <small id="syncStatus">동기화 대기</small>
        </div>
      </header>

      <section class="panel focus-panel">
        <div class="section-head">
          <div>
            <h2>내 출발 시간</h2>
            <p>닉네임 선택 후 출발 시간만 확인하세요.</p>
          </div>
          <button id="soundButton" class="ghost-button" type="button">소리 알림 켜기</button>
        </div>

        <label class="field">
          <span>내 닉네임</span>
          <select id="memberSelect">
            <option value="">멤버 불러오는 중...</option>
          </select>
        </label>

        <div id="myCards" class="my-cards"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>내 임시 집결</h2>
          </div>
        </div>

        <form id="localRallyForm" class="grid-form">
          <label class="field">
            <span>이름</span>
            <input id="localRallyName" autocomplete="off" placeholder="예: 북문 1번" />
          </label>
          <label class="field">
            <span>집결 남은시간</span>
            <input id="localRallyRemaining" inputmode="numeric" placeholder="5:00" required />
          </label>
          <label class="field">
            <span>상대 집결장 행군</span>
            <input id="localEnemyMarch" inputmode="numeric" placeholder="1:30" required />
          </label>
          <button class="primary-button" type="submit">추가</button>
        </form>
      </section>

      <details class="panel">
        <summary>전체 명단 출발표</summary>
        <div id="allTables" class="table-stack"></div>
      </details>

      <details class="panel admin-panel" id="adminDetails">
        <summary>관리자: 멤버 / 상대 집결</summary>
        <div id="adminLogin" class="admin-login">
          <label class="field">
            <span>관리자 비밀번호</span>
            <input id="adminPassword" type="password" autocomplete="current-password" />
          </label>
          <button id="adminLoginButton" class="primary-button" type="button">관리 시작</button>
        </div>

        <div id="adminTools" class="admin-tools" hidden>
          <div class="admin-grid">
            <section>
              <div class="section-head compact">
                <h2>멤버</h2>
              </div>
              <form id="memberForm" class="grid-form">
                <input id="memberId" type="hidden" />
                <label class="field">
                  <span>닉네임</span>
                  <input id="memberName" autocomplete="off" required />
                </label>
                <label class="field">
                  <span>행군시간</span>
                  <input id="memberMarch" class="time-input" inputmode="numeric" placeholder="01:20" required />
                </label>
                <button class="primary-button" type="submit">저장</button>
                <button id="memberReset" class="ghost-button" type="button">초기화</button>
              </form>
              <div id="memberAdminList" class="admin-list"></div>
            </section>

            <section>
              <div class="section-head compact">
                <h2>상대 집결 추가</h2>
              </div>
              <div class="quick-tools">
                <button id="clearSharedRallies" class="danger-button" type="button">상대 집결 전체 삭제</button>
              </div>
              <form id="sharedRallyForm" class="grid-form">
                <input id="sharedRallyId" type="hidden" />
                <label class="field">
                  <span>이름</span>
                  <input id="sharedRallyName" autocomplete="off" placeholder="예: 북문 1번" required />
                </label>
                <label class="field">
                  <span>집결 남은시간</span>
                  <input id="sharedRallyRemaining" inputmode="numeric" placeholder="5:00" required />
                </label>
                <label class="field">
                  <span>상대 집결장 행군</span>
                  <input id="sharedEnemyMarch" inputmode="numeric" placeholder="1:30" required />
                </label>
                <button class="primary-button" type="submit">추가/수정</button>
                <button id="sharedRallyReset" class="ghost-button" type="button">초기화</button>
              </form>
              <details class="bulk-box">
                <summary>여러 집결 한번에 추가</summary>
                <label class="field">
                  <span>한 줄에 하나씩: 이름 집결시간 상대행군</span>
                  <textarea id="bulkRallies" rows="5" placeholder="북문1 5:00 1:30&#10;서문2 5:00 2:10"></textarea>
                </label>
                <button id="bulkRallyAdd" class="primary-button" type="button">한번에 추가</button>
              </details>
              <div id="sharedRallyAdminList" class="admin-list"></div>
            </section>
          </div>
        </div>
      </details>

      <section id="setupNotice" class="notice" hidden></section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
